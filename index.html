<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoHero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"><meta name="theme-color" content="#163300"><style>
:root{--forest:#163300;--lime:#9fe870;--mist:#e2f6d5;--fog:#e8ebe6;--ink:#0e0f0c;--text:#454745;--pebble:#868685;--line:rgba(14,15,12,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#fff;color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,.logo:focus-visible,.lesson:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:248px;background:#fff;border-right:1px solid var(--line);padding:28px 16px;position:fixed;inset:0 auto 0 0}
.logo{font-size:26px;font-weight:900;letter-spacing:-.04em;color:var(--forest);margin-bottom:32px;cursor:pointer}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;padding:6px 18px 6px 6px;border-radius:9999px;margin:4px 0;font-weight:600;color:var(--forest)}
.ico{width:40px;height:40px;border-radius:9999px;background:var(--mist);display:grid;place-items:center;flex:none}
.ico svg,.mobile button svg{width:24px;height:24px;fill:none;stroke:var(--forest);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.nav:hover .ico{background:#fff}
.nav.active .ico{background:transparent}.nav.active .ico svg{stroke:var(--lime)}
.nav:hover{background:var(--mist)}
.nav.active{background:var(--forest);color:#fff}
.main{margin-left:248px;padding:44px 5%;width:100%;max-width:1400px}
.page{display:none;max-width:1050px;margin:auto}.page.active{display:block}
h1{font-size:clamp(38px,6vw,72px);font-weight:900;letter-spacing:-.04em;line-height:.95;color:var(--ink);margin:0 0 12px}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:28px 0 8px}
p{margin:0 0 8px}.muted{color:#6a6c6a}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid .card{margin:0}.level{grid-column:span 2;background:var(--mist);border-color:transparent}
.head{display:flex;align-items:center;gap:16px}
.avatar{width:60px;height:60px;background:var(--lime);border-radius:9999px;display:grid;place-items:center;font-size:28px;flex:none}
.grow{flex:1;min-width:0}
.progress{height:12px;background:#fff;border-radius:9999px;overflow:hidden;margin-top:16px;box-shadow:inset 0 0 0 1px var(--line)}
.progress i{display:block;height:100%;background:var(--forest);border-radius:9999px}
.stats{display:flex;justify-content:space-around;text-align:center;background:var(--fog);border-color:transparent}
.stat{padding:8px}.stat b{display:block;font-size:30px;font-weight:900;letter-spacing:-.03em;color:var(--ink);margin:2px}
.banner{background:var(--forest);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:32px;border-color:transparent}
.banner h2{color:var(--lime);font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-.03em;line-height:1;margin:0 0 10px}
.banner p{margin:0}
.task{display:flex;align-items:center;gap:16px}
.taskicon{width:56px;height:56px;border-radius:9999px;background:var(--mist);display:grid;place-items:center;font-size:26px;flex:none}
.btn{background:var(--lime);color:var(--forest);padding:12px 24px;border-radius:9999px;font-weight:600;white-space:nowrap;transition:transform .15s}
.btn:hover:not(:disabled){transform:scale(1.04)}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{background:var(--fog);color:var(--pebble);cursor:default}
.filters{margin:18px 0 6px;display:flex;gap:8px;flex-wrap:wrap}
.filters button{padding:9px 18px;border-radius:9999px;background:var(--fog);color:var(--forest);font-weight:600}
.filters .on{background:var(--lime);color:var(--forest)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.ach .card{text-align:center;margin:0}
.badge{font-size:44px}
.lesson{display:flex;gap:16px;align-items:center;cursor:pointer;transition:background .15s}
.lesson:hover{background:var(--mist)}
.lessonicon{font-size:30px;background:var(--mist);width:64px;height:64px;border-radius:9999px;display:grid;place-items:center;flex:none}
.metric{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.metric:last-child{border:0}.metric strong{margin-left:auto;color:var(--forest)}
.modal{position:fixed;inset:0;background:rgba(22,51,0,.6);display:grid;place-items:center;padding:20px;z-index:10}
.modalbox{background:#fff;border-radius:28px;padding:32px;max-width:500px;width:100%}
.close{float:right;border-radius:9999px;background:var(--fog);width:36px;height:36px;font-size:20px;line-height:1}
.auth{min-height:100vh;display:grid;place-items:center;background:var(--forest);padding:20px}
.login{max-width:440px;width:100%;background:#fff;padding:36px;border-radius:28px}
.login .logo{margin-bottom:20px}
.login label{display:block;font-weight:600;color:var(--forest)}
.login input{width:100%;padding:13px 16px;margin:8px 0 16px;border:1px solid var(--pebble);border-radius:10px;font:inherit}
.login input:focus{border-color:var(--forest);outline:0}
.full{width:100%;margin-top:8px}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
.i-green{color:var(--forest)}.i-blue{color:#0b4c72}.i-orange{color:#b4400c}.i-amber{color:#8a5a00}.i-gray{color:#454745}
.logo .i{font-size:1.4em;margin-right:6px;vertical-align:-.28em}
.avatar{font-size:40px}.taskicon{font-size:28px}.lessonicon{font-size:32px}
.avatar .i{color:var(--forest)}
.badge{width:76px;height:76px;margin:0 auto 12px;border-radius:9999px;background:var(--mist);display:grid;place-items:center;font-size:40px}
.ach .card>.i{font-size:24px}
.stat .i{font-size:44px;margin-bottom:4px}
.metric .i{font-size:32px}.metric{align-items:center}
.bannerico{font-size:64px;line-height:0;color:var(--lime);flex:none}
.bigicon{font-size:64px;line-height:0;text-align:center;background:var(--mist);border-radius:28px;padding:22px}
.taskicon:has(.i-blue),.lessonicon:has(.i-blue),.badge:has(.i-blue),.bigicon:has(.i-blue){background:#dcecf7}
.taskicon:has(.i-orange),.badge:has(.i-orange){background:#fde8d7}
.taskicon:has(.i-amber),.badge:has(.i-amber){background:#fdf0c4}
.badge:has(.i-gray){background:var(--fog)}
.mobile{display:none}
@media(max-width:800px){
.side{inset:auto 0 0 0;width:100%;display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:5}
.side .logo{display:none}
.nav{margin:0;padding:6px 2px;font-size:11px;text-align:center;flex:1;flex-direction:column;justify-content:center;gap:2px}
.ico{width:34px;height:34px}.ico svg{width:22px;height:22px}
.main{margin:0;padding:20px 16px 100px}
.mobile{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mobile .logo{margin:0}.mobile button{background:var(--mist);width:42px;height:42px;border-radius:9999px;display:grid;place-items:center}.mobile button svg{width:26px;height:26px}
.grid{grid-template-columns:1fr}.level{grid-column:auto}
.ach{grid-template-columns:1fr 1fr}
.task{flex-wrap:wrap}.task .grow{flex-basis:60%}.task .btn{margin-left:auto;padding:10px 18px}
.banner{padding:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.ghost{float:right;background:var(--fog);color:var(--forest);padding:8px 16px;border-radius:9999px;font-weight:600}
.chip{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--forest);background:var(--mist);border-radius:9999px;padding:2px 10px}
.chip.w{background:#fdf0c4;color:#8a5a00}
.login select{width:100%;padding:13px 16px;margin:8px 0 16px;border:1px solid var(--pebble);border-radius:10px;font:inherit;background:#fff}
.login .chk{display:flex;gap:10px;font-weight:400;font-size:13px;color:var(--text)}.login .chk input{width:auto;margin:3px 0 0}
.forest{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cell{aspect-ratio:1;border-radius:20px;background:var(--mist);display:grid;place-items:center;font-size:34px}.cell.off{opacity:.35;background:var(--fog)}
.rk{display:flex;align-items:center;gap:16px}.rk .n{width:44px;height:44px;border-radius:9999px;background:var(--fog);display:grid;place-items:center;font-weight:900;color:var(--forest);flex:none}
.rk.me{background:var(--mist);border-color:transparent}.rk.me .n{background:var(--lime)}
.row2{display:flex;gap:8px}.row2 .btn{padding:8px 14px}.btn.no{background:var(--fog)}
@media(max-width:800px){.forest{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div id="auth" class="auth"><div class="login"><div class="logo"><svg class="i i-green" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 C5 10 10 5 19 5 C19 14 14 19 5 19 Z"/><path d="M5 19 L13 11"/></svg> EcoHero</div><h1>Привет, герой! 👋</h1><p class="muted">Маленькие действия меняют большой мир.</p>
<label>Код группы<input id="code" placeholder="ECO-7A" autocomplete="off"></label>
<label>Я<select id="role"><option value="s">Школьник</option><option value="t">Педагог / координатор</option></select></label>
<label class="chk"><input type="checkbox" id="agree"><span>Я ознакомился с правилами: сервис хранит только обезличенный код участника; участие согласовано со школой и родителями.</span></label>
<p id="err" style="color:#b4400c;font-size:13px;font-weight:600;min-height:18px;margin:10px 0 0"></p>
<button class="btn full" onclick="login()">Войти в EcoHero</button><p class="muted" style="font-size:12px;text-align:center">Демо-версия. Коды групп: ECO-7A, ECO-7B, ECO-8A</p></div></div>
<div id="app" class="app" style="display:none"><aside class="side"><div class="logo" role="button" tabindex="0" title="На главную" onclick="home0()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();home0()}"><svg class="i i-green" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 C5 10 10 5 19 5 C19 14 14 19 5 19 Z"/><path d="M5 19 L13 11"/></svg> EcoHero</div><nav id="nv" style="display:contents"></nav></aside>
<main class="main"><div class="mobile"><div class="logo" role="button" tabindex="0" onclick="home0()"><svg class="i i-green" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 C5 10 10 5 19 5 C19 14 14 19 5 19 Z"/><path d="M5 19 L13 11"/></svg> EcoHero</div></div><section id="pg" class="page active"></section></main></div>
<div id="modal" class="modal" style="display:none"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="mc"></div></div></div>
<script>
(() => {
  const $ = id => document.getElementById(id);

  const IC = {
    leaf:['green','<path d="M5 19 C5 10 10 5 19 5 C19 14 14 19 5 19 Z"/><path d="M5 19 L13 11"/>'],
    sprout:['green','<path d="M12 20 V11"/><path d="M12 13 C12 9 9 7 5 7 C5 11 8 13 12 13 Z"/><path d="M12 11 C12 7.5 14.5 5 19 5 C19 9 16 11 12 11 Z"/>'],
    tree:['green','<path d="M12 3.5 C16 3.5 18.5 6.5 17.5 10 C19.5 11 19.5 14.5 17 15.5 H7 C4.5 14.5 4.5 11 6.5 10 C5.5 6.5 8 3.5 12 3.5 Z"/><path d="M12 15.5 V20.5"/>'],
    recycle:['green','<path d="M5.5 11 A6.5 6.5 0 0 1 17 7.5"/><path d="M17.5 4 V8 H13.5"/><path d="M18.5 13 A6.5 6.5 0 0 1 7 16.5"/><path d="M6.5 20 V16 H10.5"/>'],
    bag:['green','<path d="M5.5 8.5 H18.5 L19.5 20 H4.5 Z"/><path d="M9 8.5 V7 A3 3 0 0 1 15 7 V8.5"/>'],
    globe:['green','<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5 C9 7 9 17 12 20.5 C15 17 15 7 12 3.5"/><path d="M3.5 12 H20.5"/>'],
    trophy:['green','<path d="M8 4.5 H16 V10 A4 4 0 0 1 8 10 Z"/><path d="M8 6.5 H5 V8 A3 3 0 0 0 8 11"/><path d="M16 6.5 H19 V8 A3 3 0 0 1 16 11"/><path d="M12 14 V17.5"/><path d="M8.5 19.5 H15.5"/>'],
    check:['green','<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.5 L11 15 L15.5 9.5"/>'],
    bottle:['blue','<path d="M10 3.5 H14 V6 H10 Z"/><path d="M10 6 C10 8 8 8.5 8 11 V19 A1.5 1.5 0 0 0 9.5 20.5 H14.5 A1.5 1.5 0 0 0 16 19 V11 C16 8.5 14 8 14 6"/><path d="M8 13 H16"/>'],
    drop:['blue','<path d="M12 3.5 C12 3.5 5.5 10.5 5.5 14.5 A6.5 6.5 0 0 0 18.5 14.5 C18.5 10.5 12 3.5 12 3.5 Z"/>'],
    flame:['orange','<path d="M12 3.5 C12.5 7 16.5 8.5 16.5 13.5 A4.5 4.5 0 0 1 7.5 13.5 C7.5 11.5 8.5 10.5 9.5 9.5 C9.5 11 10.5 11.5 11 11.5 C11.5 9 11 6 12 3.5 Z"/>'],
    star:['amber','<path d="M12 3.8 L14.4 9 L20 9.7 L15.9 13.6 L17 19.2 L12 16.4 L7 19.2 L8.1 13.6 L4 9.7 L9.6 9 Z"/>'],
    lock:['gray','<rect x="6.5" y="11" width="11" height="8.5" rx="2"/><path d="M8.5 11 V8 A3.5 3.5 0 0 1 15.5 8 V11"/><circle cx="12" cy="15" r=".8"/>']
  };

  function ic(name, plain) {
    const d = IC[name];
    return '<svg class="i' + (plain ? '' : ' i-' + d[0]) + '" viewBox="0 0 24 24" aria-hidden="true">' + d[1] + '</svg>';
  }


  Object.assign(IC, {
    home:['green','<path d="M4 11.5 L12 4.5 L20 11.5"/><path d="M6 9.8 V19.5 H18 V9.8"/><path d="M10 19.5 V14 H14 V19.5"/>'],
    bulb:['amber','<path d="M12 3.5 A5.5 5.5 0 0 0 8.5 13.5 C9.3 14.2 9.5 15 9.5 17 H14.5 C14.5 15 14.7 14.2 15.5 13.5 A5.5 5.5 0 0 0 12 3.5 Z"/><path d="M10 20 H14"/>'],
    box:['amber','<path d="M4.5 8 L12 4 L19.5 8 V16.5 L12 20.5 L4.5 16.5 Z"/><path d="M4.5 8 L12 12 L19.5 8"/><path d="M12 12 V20.5"/>'],
    paper:['blue','<path d="M7 3.5 H14 L18 7.5 V20.5 H7 Z"/><path d="M14 3.5 V7.5 H18"/><path d="M9.5 12 H15.5"/><path d="M9.5 15.5 H15.5"/>'],
    people:['green','<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19.5 C3.5 16 6 14.5 9 14.5 C12 14.5 14.5 16 14.5 19.5"/><circle cx="17" cy="9.5" r="2.3"/><path d="M16.5 14.5 C19 14.5 20.5 16 20.5 19"/>'],
    clock:['amber','<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5 V12 L15 14"/>'],
    chart:['green','<path d="M5 19.5 V10"/><path d="M12 19.5 V5"/><path d="M19 19.5 V13"/>']
  });
  const G = {'ECO-7A':'7А','ECO-7B':'7Б','ECO-8A':'8А'};
  const D = 'Ежедневные', O = 'Разовые';
  // [название, описание, баллы, иконка, периодичность, проверка (0 самоотчёт / 1 педагог), уровень]
  const T = [
    ['Используй многоразовую бутылку','Возьми с собой многоразовую бутылку вместо одноразовой.',15,'bottle',D,0,1],
    ['Экономь воду','Закрывай кран, пока чистишь зубы.',15,'drop',D,0,1],
    ['Откажись от одноразового пакета','Используй многоразовую сумку.',15,'bag',D,0,1],
    ['Выключай свет','Выключай свет, выходя из комнаты.',10,'bulb',D,0,1],
    ['Обед в многоразовом контейнере','Возьми еду в контейнере вместо плёнки и пакетов.',15,'box',D,0,1],
    ['Без пищевых отходов','Съешь обед без остатков или возьми остаток домой.',15,'leaf',D,0,1],
    ['Выключи зарядку','Вынимай зарядное из розетки, когда оно не используется.',10,'bulb',D,0,1],
    ['Душ короче на минуту','Сократи время в душе хотя бы на минуту.',20,'drop',D,0,2],
    ['Памятка по сортировке','Изучи памятку школы по раздельному сбору отходов.',20,'recycle',O,1,1],
    ['Сортируй бумагу в школе','Положи бумажные отходы в школьный контейнер для макулатуры.',20,'paper',O,1,2],
    ['Аудит упаковки дома','Найди дома 5 лишних упаковок и придумай, чем их заменить.',25,'box',O,1,2],
    ['Способ экономии воды','Предложи педагогу способ экономии воды (1–2 предложения).',30,'drop',O,1,2],
    ['Макулатура в согласованной акции','Сдай макулатуру только на официальной акции школы.',30,'paper',O,1,2],
    ['Посади растение','Посади или пересади растение в классе или дома.',30,'sprout',O,1,2],
    ['Вторая жизнь вещи','Отремонтируй вещь или отдай её вместо выбрасывания.',30,'recycle',O,1,2],
    ['Расскажи о привычке','Расскажи классу об одной экопривычке (1 минута).',30,'people',O,1,2],
    ['День без одноразового пластика','Проведи день без одноразового пластика.',35,'bottle',O,1,3],
    ['Школьная экоакция','Участвуй в организованной акции под руководством взрослых.',40,'tree',O,1,3],
    ['Идея для экошколы','Предложи одну идею, как сделать школу экологичнее.',40,'bulb',O,1,3],
    ['Эко-дорога в школу','Если это безопасно, добирайся пешком или на транспорте.',20,'globe',D,0,2]
  ];
  const P = [['EH-3817',9,1],['EH-5502',7,1],['EH-2290',6,1],['EH-7146',5,1],['EH-4038',4,0],['EH-6615',3,1],['EH-1924',1,0],['EH-8873',0,0]];
  const OT = {'7А':520,'7Б':640,'8А':590,'8Б':450,'9А':380};
  const LV = ['Новичок-эколог','Эко-ученик','Эко-практик','Эко-лидер','Эко-эксперт'];
  const A = [['Начало пути','Выполни 5 заданий','sprout',5],['Привычка','7 дней подряд','flame',7],['Берегу воду','Выполни 10 заданий','drop',10],['Чистая планета','Выполни 25 заданий','globe',25],['Эко-эксперт','Достигни 5 уровня','star',5],['Настоящий герой','Выполни 50 заданий','trophy',50]];
  const DAYCAP = 60;
  const SAFE = 'Безопасность: не трогай острые, стеклянные и химические отходы, не ходи в небезопасные места. Акции с отходами — только вместе со взрослыми.';
  const NV = {
    s:[['home','Главная','home'],['tasks','Задания','check'],['prog','Прогресс','sprout'],['rate','Рейтинг','trophy']],
    t:[['panel','Панель','chart'],['rate','Рейтинг','trophy'],['tasks','Задания','check']]
  };

  let S;
  try { S = JSON.parse(localStorage.getItem('ecohero2') || 'null'); } catch (e) { S = null; }
  S = S || {role:'', code:'', pid:'', log:[], dp:{}, dq:[['EH-3817',12],['EH-5502',15]]};
  let filter = 'Все', cur = 'home';

  const save = () => { try { localStorage.setItem('ecohero2', JSON.stringify(S)); } catch (e) {} };
  const today = () => new Date().toLocaleDateString('sv');
  const ok = () => S.log.filter(x => x.s === 'ok');
  const pts = () => ok().reduce((a, x) => a + T[x.t][2], 0);
  const lvl = () => Math.floor(pts() / 100) + 1;
  const pct = () => pts() % 100;
  const out = '<button class="ghost" onclick="logout()">Выйти</button>';
  const head = (h, p) => `${out}<h1>${h}</h1><p class="muted">${p}</p>`;

  function streak() {
    const ds = new Set(ok().map(x => x.d));
    let n = 0, d = new Date();
    if (!ds.has(d.toLocaleDateString('sv'))) d.setDate(d.getDate() - 1);
    while (ds.has(d.toLocaleDateString('sv'))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function weekActive() {
    const l = new Date(); l.setDate(l.getDate() - 6);
    const m = l.toLocaleDateString('sv');
    return S.log.some(x => x.s !== 'no' && x.d >= m);
  }
  // 0 — доступно, 1 — ждёт педагога, 2 — выполнено (сегодня для ежедневных)
  function st(i) {
    const L = S.log.filter(x => x.t === i && x.s !== 'no' && (T[i][4] === D ? x.d === today() : true));
    return !L.length ? 0 : L.some(x => x.s === 'wait') ? 1 : 2;
  }
  const selfToday = () => S.log.filter(x => x.d === today() && x.s === 'ok' && !T[x.t][5]).reduce((a, x) => a + T[x.t][2], 0);
  function teams() {
    const g = G[S.code];
    const dpn = Object.values(S.dp).reduce((a, b) => a + b, 0);
    return Object.entries(OT).map(([n, b]) => [n, b + (n === g ? pts() + dpn * 20 : 0), n === g]).sort((a, b) => b[1] - a[1]);
  }

  function taskRow(i, teacher) {
    const x = T[i], s = st(i);
    return `<div class="card task"><div class="taskicon">${ic(x[3])}</div><div class="grow"><b>${x[0]}</b><p class="muted">${x[1]}</p>
      <span class="chip">Уровень ${x[6]}</span> <span class="chip ${x[5] ? 'w' : ''}">${x[5] ? 'подтверждает педагог' : 'самоотчёт'}</span></div>
      <b style="color:var(--forest);font-weight:700">+${x[2]}</b>
      <button class="btn" onclick="openTask(${i})">${s === 2 ? '✓' : s === 1 ? 'Ждёт' : 'Открыть'}</button></div>`;
  }

  function home() {
    const dl = T.map((x, i) => i).filter(i => T[i][4] === D && !T[i][5]);
    const i = dl[Math.floor(Date.now() / 864e5) % dl.length], t = T[i], s = st(i);
    const place = teams().findIndex(x => x[2]) + 1, w = S.log.filter(x => x.s === 'wait').length;
    return `${out}<h1>Привет, герой! 👋</h1><p class="muted">Код участника: <b>${S.pid}</b> · класс ${G[S.code]}</p>
    <div class="grid"><div class="card level"><div class="head"><div class="avatar">${ic('leaf')}</div><div class="grow"><b>Уровень ${lvl()}</b><div class="muted">${LV[Math.min(lvl() - 1, 4)]}</div></div><b style="color:var(--forest);font-weight:700">${pts()} баллов</b></div><div class="progress"><i style="width:${pct()}%"></i></div></div>
    <div class="card stats"><div class="stat">${ic('flame')}<b>${streak()}</b><small>дней</small></div><div class="stat">${ic('sprout')}<b>${ok().length}</b><small>заданий</small></div><div class="stat">${ic('clock')}<b>${w}</b><small>на проверке</small></div></div></div>
    <div class="card banner"><div><h2>Вместе мы можем больше!</h2><p>Класс ${G[S.code]} — ${place} место в командном рейтинге.</p></div><span class="bannerico">${ic('globe', true)}</span></div>
    <h2>Задание дня</h2><div class="card task"><div class="taskicon">${ic(t[3])}</div><div class="grow"><b>${t[0]}</b><p class="muted">${t[1]}</p></div><b style="color:var(--forest);font-weight:700">+${t[2]}</b>
    <button class="btn" onclick="openTask(${i})" ${s ? 'disabled' : ''}>${s === 2 ? 'Выполнено ✓' : s === 1 ? 'Ждёт' : 'Выполнить'}</button></div>
    <p class="muted" style="font-size:14px">${SAFE}</p>`;
  }

  function tasks() {
    const v = T.map((x, i) => i).filter(i => filter === 'Все' || T[i][4] === filter);
    return head('Задания', 'Небольшие действия — большой результат. Всего заданий: ' + T.length) +
      `<div class="filters">${['Все', D, O].map(x => `<button class="${filter === x ? 'on' : ''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div>` +
      v.map(i => taskRow(i)).join('');
  }

  function prog() {
    const n = ok().length, t = Math.min(12, Math.floor(pts() / 50));
    let cells = '';
    for (let i = 0; i < 12; i++) { const p = pts() - 50 * i; cells += `<div class="cell ${p > 0 ? '' : 'off'}">${p >= 50 ? ic('tree') : ic('sprout')}</div>`; }
    return head('Прогресс', 'Только подтверждённые действия.') +
      `<div class="card"><h2 style="margin-top:0">Мой эколес</h2><p class="muted">Деревьев: ${t} из 12. Каждые 50 баллов растят новое дерево.</p><div class="forest">${cells}</div></div>
      <div class="card"><div class="metric">${ic('check')} <span>Подтверждено заданий</span><strong>${n}</strong></div>
      <div class="metric">${ic('star')} <span>Баллы</span><strong>${pts()}</strong></div>
      <div class="metric">${ic('flame')} <span>Дней подряд</span><strong>${streak()}</strong></div>
      <div class="metric">${ic('clock')} <span>Ждут подтверждения</span><strong>${S.log.filter(x => x.s === 'wait').length}</strong></div></div>
      <h2>Достижения</h2><div class="ach">${A.map((a, i) => {
        const u = i === 1 ? streak() >= 7 : i === 4 ? lvl() >= 5 : n >= a[3];
        return `<div class="card"><div class="badge">${ic(a[2])}</div><b>${a[0]}</b><p class="muted">${a[1]}</p>${u ? ic('check') : ic('lock')}</div>`;
      }).join('')}</div>`;
  }

  function rate() {
    return head('Рейтинг классов', 'Командное соревнование. Личных рейтингов нет, имён не публикуем.') +
      teams().map((t, k) => `<div class="card rk ${t[2] ? 'me' : ''}"><div class="n">${k + 1}</div><div class="grow"><b>Класс ${t[0]}</b>${t[2] ? ' <span class="chip">твой класс</span>' : ''}</div><b style="color:var(--forest);font-weight:700">${t[1]} баллов</b></div>`).join('') +
      '<p class="muted" style="font-size:13px">Данные других классов в демо условные.</p>';
  }

  function rows() {
    const r = P.map(([c, b, a]) => ({c, n: b + (S.dp[c] || 0), a: !!a}));
    if (S.pid) r.push({c: S.pid + ' (этот браузер)', n: ok().length, a: weekActive()});
    return r;
  }
  function panel() {
    const r = rows(), N = r.length, pc = f => Math.round(100 * r.filter(f).length / N);
    const q = [...S.log.map((x, k) => ({k, c: S.pid, t: x.t, d: x.d, s: x.s, l: 1})).filter(x => x.s === 'wait'),
               ...S.dq.map((x, k) => ({k, c: x[0], t: x[1], d: 'демо', l: 0}))];
    const a = pc(x => x.a), b = pc(x => x.n >= 4);
    return head('Панель педагога', `Группа ${G[S.code]}. Участники показаны только по обезличенным кодам.`) +
      `<div class="card"><h2 style="margin-top:0">Показатели пилота</h2>
      <div class="metric">${ic('people')} <span>Участников в группе</span><strong>${N}</strong></div>
      <div class="metric">${ic('flame')} <span>Активны за 7 дней (цель ≥ 40%)</span><strong>${a}%</strong></div>
      <div class="metric">${ic('check')} <span>≥ 4 заданий (цель ≥ 50%)</span><strong>${b}%</strong></div>
      <div class="metric">${ic('clock')} <span>Ждут подтверждения</span><strong>${q.length}</strong></div></div>
      <h2>Подтверждение заданий</h2>
      ${q.length ? q.map(x => `<div class="card task"><div class="taskicon">${ic(T[x.t][3])}</div><div class="grow"><b>${T[x.t][0]}</b><p class="muted">${x.c} · ${x.d}</p></div>
        <div class="row2"><button class="btn" onclick="decide(${x.l},${x.k},1)">Принять</button><button class="btn no" onclick="decide(${x.l},${x.k},0)">Отклонить</button></div></div>`).join('') : '<p class="muted">Новых заданий на проверку нет.</p>'}
      <h2>Участники</h2><div class="card">${r.map(x => `<div class="metric"><span>${x.c}</span><strong>${x.n} зад. · ${x.a ? 'активен' : 'не активен'}</strong></div>`).join('')}</div>
      <button class="btn full" onclick="report()">Скачать отчёт (CSV)</button>`;
  }

  const R = {home, tasks, prog, rate, panel};
  function go(id) {
    cur = id;
    $('pg').innerHTML = R[id]();
    document.querySelectorAll('.nav').forEach(b => b.classList.toggle('active', b.dataset.p === id));
    window.scrollTo(0, 0);
  }
  window.showPage = go;
  window.home0 = () => go(S.role === 't' ? 'panel' : 'home');
  window.setFilter = v => { filter = v; go('tasks'); };
  window.closeModal = () => { $('modal').style.display = 'none'; };

  window.openTask = i => {
    const t = T[i], s = st(i);
    const btn = S.role === 't' ? '<p class="muted" style="font-size:14px">Режим педагога: просмотр каталога.</p>'
      : `<button class="btn full" ${s ? 'disabled' : ''} onclick="submit(${i})">${s === 2 ? 'Уже выполнено ✓' : s === 1 ? 'Ждёт подтверждения педагога' : t[5] ? 'Отправить на подтверждение' : 'Отметить как выполненное'}</button>`;
    $('mc').innerHTML = `<div class="bigicon">${ic(t[3])}</div><h2>${t[0]}</h2><p class="muted">${t[1]}</p>
      <div class="card"><b>Награда</b><strong style="float:right;color:var(--forest);font-weight:700">+${t[2]} баллов</strong></div>
      <p class="muted" style="font-size:14px"><b>Проверка:</b> ${t[5] ? 'задание уйдёт педагогу, баллы начислятся после подтверждения.' : 'отмечается самостоятельно, лимит ' + DAYCAP + ' баллов в день.'}</p>
      <p class="muted" style="font-size:14px">${SAFE}</p>${btn}`;
    $('modal').style.display = 'grid';
  };
  window.submit = i => {
    const t = T[i];
    if (st(i)) return;
    if (!t[5] && selfToday() + t[2] > DAYCAP) {
      if (!$('warn')) $('mc').insertAdjacentHTML('beforeend', '<p id="warn" style="color:#b4400c;font-weight:600">Дневной лимит баллов за самостоятельные задания исчерпан. Попробуй завтра или выбери задание с подтверждением педагога.</p>');
      return;
    }
    S.log.push({t: i, d: today(), s: t[5] ? 'wait' : 'ok'});
    save(); closeModal(); go(cur);
  };
  window.decide = (own, k, yes) => {
    if (own) S.log[k].s = yes ? 'ok' : 'no';
    else { if (yes) { const c = S.dq[k][0]; S.dp[c] = (S.dp[c] || 0) + 1; } S.dq.splice(k, 1); }
    save(); go('panel');
  };
  window.report = () => {
    const csv = 'Код участника;Подтверждено заданий;Активен за 7 дней\n' + rows().map(x => [x.c, x.n, x.a ? 'да' : 'нет'].join(';')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], {type: 'text/csv'}));
    a.download = 'ecohero_report.csv'; a.click();
  };

  function start() {
    $('auth').style.display = 'none';
    $('app').style.display = 'flex';
    $('nv').innerHTML = NV[S.role].map(([id, l, i]) => `<button class="nav" data-p="${id}" onclick="showPage('${id}')"><span class="ico">${ic(i, true)}</span><span>${l}</span></button>`).join('');
    home0();
  }
  window.login = () => {
    const c = $('code').value.trim().toUpperCase(), e = $('err');
    if (!G[c]) { e.textContent = 'Неизвестный код группы. Демо-коды: ECO-7A, ECO-7B, ECO-8A.'; return; }
    if (!$('agree').checked) { e.textContent = 'Нужно подтвердить согласие с правилами.'; return; }
    S.code = c; S.role = $('role').value;
    if (S.role === 's' && !S.pid) S.pid = 'EH-' + (1000 + Math.floor(Math.random() * 9000));
    save(); start();
  };
  window.logout = () => {
    S.role = ''; save();
    $('app').style.display = 'none'; $('auth').style.display = ''; $('err').textContent = '';
  };
  if (S.role && G[S.code]) start();
})();
</script>

</body></html>
