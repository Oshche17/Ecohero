<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoHero</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4faf5;color:#18331d}button{font:inherit;cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:240px;background:white;border-right:1px solid #e1ece2;padding:28px 16px;position:fixed;inset:0 auto 0 0}.logo{font-size:25px;font-weight:900;color:#2e7d32;margin-bottom:35px}.nav{display:block;width:100%;text-align:left;background:white;padding:14px;border-radius:14px;margin:5px 0;font-weight:700;color:#68776b}.nav.active,.nav:hover{background:#eaf6ec;color:#2e7d32}.main{margin-left:240px;padding:38px 5%;width:100%;max-width:1400px}.page{display:none;max-width:1050px;margin:auto}.page.active{display:block}h1{font-size:30px;margin:0 0 5px}h2{font-size:20px}.muted{color:#718073}.card{background:white;border:1px solid #e1ece2;border-radius:20px;padding:20px;box-shadow:0 5px 20px #1f50260b;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.level{grid-column:span 2}.head{display:flex;align-items:center;gap:14px}.avatar{width:58px;height:58px;background:#eaf6ec;border-radius:18px;display:grid;place-items:center;font-size:28px}.grow{flex:1}.progress{height:10px;background:#dcebdd;border-radius:20px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:#4caf50}.stats{display:flex;justify-content:space-around;text-align:center}.stat{padding:8px}.stat b{display:block;font-size:20px;margin:4px}.banner{background:#176b3a;color:white;display:flex;justify-content:space-between;align-items:center}.task{display:flex;align-items:center;gap:14px}.taskicon{width:55px;height:55px;border-radius:16px;background:#eaf6ec;display:grid;place-items:center;font-size:26px}.btn{background:#2e7d32;color:white;padding:11px 17px;border-radius:13px;font-weight:800}.btn:disabled{background:#a8b4aa}.filters button{padding:9px 15px;border-radius:20px;background:#e8f2e9;color:#667468;margin-right:6px}.filters .on{background:#2e7d32;color:white}.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.ach .card{text-align:center}.badge{font-size:40px}.lesson{display:flex;gap:14px;align-items:center}.lessonicon{font-size:30px;background:#eaf6ec;padding:14px;border-radius:16px}.metric{padding:13px 0;border-bottom:1px solid #e1ece2;display:flex;gap:12px}.metric:last-child{border:0}.metric strong{margin-left:auto;color:#2e7d32}.modal{position:fixed;inset:0;background:#10261588;display:grid;place-items:center;padding:20px}.modalbox{background:white;border-radius:25px;padding:30px;max-width:500px;width:100%}.close{float:right;border-radius:50%;background:#eaf6ec;padding:7px}.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#edf9ef,#fff);padding:20px}.login{max-width:430px;width:100%;background:white;padding:35px;border-radius:25px;box-shadow:0 15px 50px #17491d12}.login input{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #dce9de;border-radius:12px}.full{width:100%;margin-top:8px}.mobile{display:none}@media(max-width:800px){.side{display:none}.main{margin:0;padding:20px 15px 90px}.mobile{display:flex;justify-content:space-between;margin-bottom:20px}.grid{grid-template-columns:1fr}.level{grid-column:auto}.ach{grid-template-columns:1fr 1fr}.task{align-items:flex-start}.task .btn{margin-left:auto;padding:9px}.banner{padding:16px}}
</style></head><body>
<div id="auth" class="auth"><div class="login"><div class="logo">🍃 EcoHero</div><h1>Привет, герой! 👋</h1><p class="muted">Маленькие действия меняют большой мир.</p><label>Имя<input id="name" placeholder="Эко-герой"></label><label>Email<input id="email" placeholder="you@example.com"></label><button class="btn full" onclick="login()">Войти в EcoHero</button><p class="muted" style="font-size:12px;text-align:center">Демо-версия без настоящей регистрации</p></div></div>
<div id="app" class="app" style="display:none"><aside class="side"><div class="logo">🍃 EcoHero</div><button class="nav active" onclick="page('home',this)">🏠 Главная</button><button class="nav" onclick="page('lessons',this)">📚 Уроки</button><button class="nav" onclick="page('tasks',this)">✅ Задания</button><button class="nav" onclick="page('ach',this)">🏆 Достижения</button><button class="nav" onclick="page('profile',this)">👤 Профиль</button></aside>
<main class="main"><div class="mobile"><div class="logo">🍃 EcoHero</div><button onclick="page('profile')">👤</button></div>
<section id="home" class="page active"></section><section id="lessons" class="page"></section><section id="tasks" class="page"></section><section id="ach" class="page"></section><section id="profile" class="page"></section></main></div>
<div id="modal" class="modal" style="display:none"><div class="modalbox"><button class="close" onclick="closeM()">×</button><div id="mc"></div></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const T = [
    ['Используй многоразовую бутылку','Возьми с собой многоразовую бутылку вместо одноразовой.',20,'🧴','Ежедневные'],
    ['Пройди мини-тест о переработке','Проверь свои знания о сортировке отходов.',15,'♻️','Разовые'],
    ['Экономь воду','Закрывай кран, пока чистишь зубы.',25,'💧','Ежедневные'],
    ['Убери мусор в парке','Собери безопасный мусор и выброси его правильно.',30,'🌳','Разовые'],
    ['Откажись от одноразового пакета','Используй многоразовую сумку.',20,'🛍️','Ежедневные']
  ];

  const L = [
    ['Что такое экология?','Почему важно заботиться о природе','🌳'],
    ['Сортировка отходов','Как правильно разделять мусор','♻️'],
    ['Пластик: польза и вред','Как пластик влияет на природу','🧴'],
    ['Вода — ценнейший ресурс','Как экономить воду каждый день','💧']
  ];

  const A = [
    ['Начало пути','Выполни 5 заданий','🌱',5],
    ['Берегу воду','Выполни 10 заданий','💧',10],
    ['Сортировщик','Выполни 2 урока','♻️',2],
    ['Чистая планета','Выполни 25 заданий','🌍',25],
    ['Эко-эксперт','Достигни 10 уровня','⭐',10],
    ['Настоящий герой','Выполни 50 заданий','🏆',50]
  ];

  let state;
  try {
    state = JSON.parse(localStorage.getItem('ecohero') || 'null');
  } catch (e) {
    state = null;
  }
  state = state || {name:'Эко-герой', email:'', xp:320, done:[], lessons:[], streak:5};

  let filter = 'Все';

  function save() {
    localStorage.setItem('ecohero', JSON.stringify(state));
  }

  function level() {
    return Math.floor(state.xp / 600) + 1;
  }

  function percent() {
    return (state.xp % 600) / 6;
  }

  function unlocked() {
    return A.filter((a, i) => {
      if (i === 2) return state.lessons.length >= a[3];
      if (i === 4) return level() >= 10;
      return state.done.length >= a[3];
    }).length;
  }

  window.login = function() {
    const name = $('name').value.trim() || 'Эко-герой';
    const email = $('email').value.trim();

    state.name = name;
    state.email = email;
    save();

    $('auth').style.display = 'none';
    $('app').style.display = 'flex';
    renderAll();
    showPage('home');
  };

  window.showPage = function(id, button) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    const target = $(id);
    if (target) target.classList.add('active');

    document.querySelectorAll('.nav').forEach(el => el.classList.remove('active'));
    if (button) button.classList.add('active');

    renderAll();
    if (target) target.classList.add('active');
  };

  function renderAll() {
    renderHome();
    renderLessons();
    renderTasks();
    renderAchievements();
    renderProfile();
  }

  function renderHome() {
    const t = T[0];
    const done = state.done.includes(0);

    $('home').innerHTML = `
      <h1>Привет, герой! 👋</h1>
      <p class="muted">Сегодня ты делаешь мир чище.</p>

      <div class="grid">
        <div class="card level">
          <div class="head">
            <div class="avatar">🌿</div>
            <div class="grow">
              <b>Уровень ${level()}</b>
              <div class="muted">Новичок-эколог</div>
            </div>
            <b style="color:#2e7d32">${state.xp} XP</b>
          </div>
          <div class="progress"><i style="width:${percent()}%"></i></div>
        </div>

        <div class="card stats">
          <div class="stat">🔥<b>${state.streak}</b><small>дней</small></div>
          <div class="stat">🌱<b>${state.done.length}</b><small>заданий</small></div>
          <div class="stat">⭐<b>${unlocked()}</b><small>значков</small></div>
        </div>
      </div>

      <div class="card banner">
        <div>
          <h2>Вместе мы можем больше!</h2>
          <p>Каждое маленькое действие имеет значение.</p>
        </div>
        <span style="font-size:50px">🌍</span>
      </div>

      <h2>Задание дня</h2>
      <div class="card task">
        <div class="taskicon">${t[3]}</div>
        <div class="grow">
          <b>${t[0]}</b>
          <p class="muted">${t[1]}</p>
        </div>
        <b style="color:#2e7d32">+${t[2]} XP</b>
        <button class="btn" onclick="openTask(0)" ${done ? 'disabled' : ''}>
          ${done ? 'Выполнено ✓' : 'Выполнить'}
        </button>
      </div>
    `;
  }

  function renderLessons() {
    $('lessons').innerHTML = `
      <h1>Уроки</h1>
      <p class="muted">Учись понимать планету — по одному уроку за раз.</p>
      ${L.map((x,i) => `
        <div class="card lesson" onclick="completeLesson(${i})">
          <div class="lessonicon">${x[2]}</div>
          <div class="grow">
            <b>${x[0]}</b>
            <p class="muted">${x[1]}</p>
            <small style="color:#2e7d32">+10 XP ${state.lessons.includes(i) ? '✓' : ''}</small>
          </div>›
        </div>
      `).join('')}
    `;
  }

  function renderTasks() {
    const visible = T.filter(x => filter === 'Все' || x[4] === filter);

    $('tasks').innerHTML = `
      <h1>Задания</h1>
      <p class="muted">Небольшие действия — большой результат.</p>
      <div class="filters">
        ${['Все','Ежедневные','Разовые'].map(x => `
          <button class="${filter === x ? 'on' : ''}" onclick="setFilter('${x}')">${x}</button>
        `).join('')}
      </div>
      ${visible.map(x => {
        const i = T.indexOf(x);
        const done = state.done.includes(i);
        return `
          <div class="card task">
            <div class="taskicon">${x[3]}</div>
            <div class="grow">
              <b>${x[0]}</b>
              <p class="muted">${x[1]}</p>
            </div>
            <b style="color:#2e7d32">+${x[2]}</b>
            <button class="btn" onclick="openTask(${i})">${done ? '✓' : 'Открыть'}</button>
          </div>
        `;
      }).join('')}
    `;
  }

  window.setFilter = function(value) {
    filter = value;
    renderTasks();
  };

  window.openTask = function(i) {
    const t = T[i];
    const done = state.done.includes(i);

    $('mc').innerHTML = `
      <div style="font-size:65px;text-align:center;background:#eaf6ec;border-radius:18px;padding:15px">${t[3]}</div>
      <h2>${t[0]}</h2>
      <p class="muted">${t[1]}</p>
      <div class="card">
        <b>Награда</b>
        <strong style="float:right;color:#2e7d32">+${t[2]} XP</strong>
      </div>
      <button class="btn full" ${done ? 'disabled' : ''} onclick="completeTask(${i})">
        ${done ? 'Уже выполнено ✓' : 'Отметить как выполненное'}
      </button>
    `;
    $('modal').style.display = 'grid';
  };

  window.closeModal = function() {
    $('modal').style.display = 'none';
  };

  window.completeTask = function(i) {
    if (state.done.includes(i)) return;

    state.done.push(i);
    state.xp += T[i][2];
    save();
    closeModal();
    renderAll();
    showPage('tasks');
  };

  window.completeLesson = function(i) {
    if (state.lessons.includes(i)) return;

    state.lessons.push(i);
    state.xp += 10;
    save();
    renderAll();
    showPage('lessons');
  };

  function renderAchievements() {
    $('ach').innerHTML = `
      <h1>Достижения</h1>
      <p class="muted">Собирай значки и становись настоящим EcoHero.</p>
      <div class="ach">
        ${A.map((a,i) => {
          const unlockedNow = i === 2
            ? state.lessons.length >= a[3]
            : i === 4
              ? level() >= 10
              : state.done.length >= a[3];

          return `
            <div class="card">
              <div class="badge">${a[2]}</div>
              <b>${a[0]}</b>
              <p class="muted">${a[1]}</p>
              ${unlockedNow ? '✅' : '🔒'}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderProfile() {
    $('profile').innerHTML = `
      <h1>Профиль</h1>
      <div class="card head">
        <div class="avatar">🧑‍🌾</div>
        <div class="grow">
          <h2>${state.name}</h2>
          <p class="muted">Уровень ${level()} · ${state.xp} XP</p>
          <div class="progress"><i style="width:${percent()}%"></i></div>
        </div>
      </div>

      <h2>Мой вклад</h2>
      <div class="card">
        <div class="metric">🌿 <span>Сокращено CO₂</span><strong>≈ ${12 + state.done.length} кг</strong></div>
        <div class="metric">🌳 <span>Сохранено деревьев</span><strong>≈ ${1 + Math.floor(state.done.length / 10)} шт.</strong></div>
        <div class="metric">💧 <span>Сэкономлено воды</span><strong>≈ ${120 + state.done.length * 25} л</strong></div>
      </div>

      <h2>Статистика</h2>
      <div class="card">
        <div class="metric">🔥 <span>Текущий стрик</span><strong>${state.streak} дней</strong></div>
        <div class="metric">⭐ <span>Достижения</span><strong>${unlocked()}</strong></div>
        <div class="metric">🌱 <span>Выполнено заданий</span><strong>${state.done.length}</strong></div>
      </div>
    `;
  }

  // If a previous demo login exists, open the app automatically.
  if (state.email || localStorage.getItem('ecohero')) {
    $('auth').style.display = 'none';
    $('app').style.display = 'flex';
    renderAll();
  }
})();
</script>

</body></html>
